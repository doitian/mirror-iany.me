baseURL = "https://blog.iany.me/"
languageCode = "en-US"
languageName = "English"
defaultContentLanguage = "en"
hasCJKLanguage = false
theme = "guidepost"
copyright = '<a rel="license" href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA 4.0</a>'
footnoteReturnLinkContents = "↩"
summaryLength = 33
enableGitInfo = true

[markup.highlight]
codeFences = false

[markup.goldmark.renderer]
unsafe = true

[permalinks]
post = "/:year/:month/:filename/"
life = "/life/:year/:month/:filename/"
game = "/games/:year/:month/:filename/"
journal = "/journal/:year/:month/:filename/"

[taxonomies]
tag = "tags"
series = "series"

[author]
name = "Ian Yang"
avatar = "/avatar-96x96.png"
givenName = "Ian"
familyName = "Yang"
email = "me@iany.me"

  [author.social]
  github  = "doitian"
  twitter = "doitian"
  vimeo   = "doitian"

[related]
includeNewer = true
  [[related.indices]]
    name = "series"
    weight = 200
  [[related.indices]]
    name = "tags"
    weight = 150
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[frontmatter]
date = [":default", ":git"]
publishDate = [":default", ":git"]

[params]
gcse = '006252023667590608831:yopsgewhz5y'
hiddenSectionsInHomeRSS = ["journal", "wiki"]
beian = '浙ICP备17004784号-1'
# disqusBaseURL = "https://blog.iany.me/"

[languages]
  [languages.en]
    title = "~iany/blog"
    languageCode = "en-US"
    hasCJKLanguage = false
    languageName = "English"
    # disqusUsername = "ianyblog"

  [[languages.en.menu.main]]
    identifier = "series"
    name = "Series"
    title = "Articles in Series"
    url = "/series/"
    weight = 2

  [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    title = "Tags"
    url = "/tags/"
    weight = 3

  [[languages.en.menu.social]]
    identifier = "about"
    pre = '<i aria-hidden="true" class="fas fa-user-circle"></i>'
    url = "/about/"
    name = "About Me"
    title = "About Me"

  [languages.zh]
    title = "~iany 博客"
    languageCode = "zh-CN"
    hasCJKLanguage = true
    languageName = "中文"
    # disqusUsername = "ianyblogcn"

  [[languages.zh.menu.main]]
    identifier = "series"
    name = "系列"
    title = "系列文章"
    url = "/zh/series/"
    weight = 2

  [[languages.zh.menu.main]]
    identifier = "tags"
    name = "标签"
    title = "标签"
