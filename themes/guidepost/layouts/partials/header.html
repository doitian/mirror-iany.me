<header class="site-header">
    <nav class="site-nav container">
        <a href="{{ "/" | relLangURL }}" class="site-logo">
            {{ with $.Site.Params.logo -}}
            <img src="{{ . }}" alt="{{ $.Site.Title }}" />
            {{ else -}}
                {{ if ne .Kind "home" -}}
                    <h1 class="site-name">{{ .Site.Title }}</h1>
                {{ end -}}
            {{ end -}}
        </a>
        <span class="nav-toggle">{{ T "menu" }} <i class="fas fa-chevron-down"></i></span>
        {{- partial "navigation.html" . -}}
    </nav>
</header>
