{{ define "main" }}
<main id="site-main" class="container">
    <div class="tag-list">
        {{ range $.Sections -}}
        <article id="section-{{ .Section }}" class="tag-card">
            <div class="tag-card-inner">
                <h3 class="tag-card-title"><a href="{{ .RelPermalink }}">{{ T (print "title." .Title) | default .Title }}</a></h3>

                <div class="tag-card-content">
                    <ul>
                        {{ range first 7 .Pages -}}
                        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
                        {{ end -}}
                    </ul>
                </div>

                <a href="{{ .RelPermalink }}" class="tag-card-read-more">
                    {{ if gt (len .Pages) 0 -}}
                    {{ T "readMore" (len .Pages) }} →
                    {{ else -}}
                    {{ T "readMoreEmpty" }}
                    {{ end -}}
                </a>
            </div>
        </article>
        {{ end -}}
    </div>
</main>
{{ end -}}
