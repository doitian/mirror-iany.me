<div class="site-inner">
    <article>
        <header class="post-header">
            <h1 class="post-title">{{ T (print "title." .Title) | default .Title }}</h1>
        </header>

        <section id="main-content" class="post-content">
            {{ if .Params.toc }}
            <aside class="toc-wrapper">
                <h2 class="active">
                    <i class="fas fa-chevron-down"></i>
                    Table of Contents 
                </h2>
                {{.TableOfContents}}
            </aside>
            {{ end }}

            {{ .Content }}
        </section>

        <footer class="post-card-footer post-meta">
            {{- partial "post-tags" . -}}
            {{- partial "author-list" . -}}
            {{- partial "reading-time.html" . -}}
        </footer>
    </article>
</div>
