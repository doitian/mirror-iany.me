{{ with .Params.tags }}
    <ul class="post-tags">
    {{ range . }}
        {{ $tag := . }}
        {{ $url := urls.Parse (. | urlize) }}
        {{ $path := $url.Path }}
        {{ with $.Site.GetPage (printf `/tags/%s` $path) }}
        <li class="post-tag">
            <a href="{{ .RelPermalink }}" rel="tag" class="tag-list-item">
                <span class="term">{{ T (print "title." .LinkTitle) | default (.LinkTitle | humanize | title) }}</span>
            </a>
        </li>
        {{ end }}
    {{ end }}
    </ul>
{{ end }}
