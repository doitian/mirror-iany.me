<div class="site-inner">
    <article>
        <header class="post-header">
            <h1 class="post-title">{{ T (print "title." .Title) | default .Title }}</h1>
        </header>

        <section id="main-content" class="post-content">
            {{ if .Params.toc }}
            <details class="toc-wrapper" open>
                <summary>
                    <i class="fas fa-chevron-right"></i>
                    Table of Contents
                </summary>
                {{.TableOfContents}}
            </details>
            {{ end }}

            {{ .Content }}
        </section>

        <footer class="post-card-footer post-meta">
            {{- partial "post-tags" . -}}
            {{- partial "author-list" . -}}
            {{- partial "lastmod-time.html" (dict "Page" .) -}}
        </footer>
    </article>
</div>
