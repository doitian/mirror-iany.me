{{ $images := .Params -}}
{{ $caption := "" -}}
{{ $kgWidth := "kg-width-wide" -}}
{{ with .Get 0 -}}
{{ if in (slice "normal" "wide" "full") . -}}
{{ $kgWidth = print "kg-width-" . -}}
{{ $images = last (sub (len $images) 1) $images -}}
{{ end -}}
{{ end -}}
<figure class="kg-card kg-gallery-card {{ $kgWidth }}">
    <div class="kg-gallery-container">
        <div class="kg-gallery-row">
            {{ range $images -}}
            {{ $src := . -}}

            {{ if (eq $src "|") }}
        </div>

        <div class="kg-gallery-row">
            {{ else if (hasPrefix $src "|") -}}
            {{ $caption = strings.TrimPrefix "|" $src -}}

            {{ else -}}
            {{ $tooltipSplits := split $src "|" -}}
            {{ $src = (index $tooltipSplits 0) -}}
            {{ $srcParts := split $src "?" -}}
            {{ $basename := path.Base (index $srcParts 0) -}}
            {{ $basename = substr $basename 0 (sub (len $basename) (len (path.Ext $basename))) -}}
            <div class="kg-gallery-image">
                {{- if or (in $src "://") (hasPrefix $src "/") -}}
                <img alt="{{ index $tooltipSplits 1 | default ($basename | title) }}" {{ with (index $tooltipSplits 1) -}}
                 class="tippy" data-tippy-content="{{.}}" {{ else -}}
                 class="tippy" data-tippy-content="{{ $basename | title }}" {{ end }}src="{{ $src }}" />
                {{- else -}}

                 {{- $img := $.Page.Resources.GetMatch (index $srcParts 0) -}}
                 {{- $queryParams := index $srcParts 1 | default "" -}}

                 {{- /* Process image */ -}}
                 {{- $processed := partial "image-process.html" (dict "img" $img "queryParams" $queryParams) -}}
                 {{- $img = $processed.img -}}

                 {{- /* Generate srcset and sizes */ -}}
                 {{- $srcsetData := partial "image-srcset.html" (dict "img" $img) -}}
                 {{- $srcsetParts := $srcsetData.srcsetParts -}}
                 {{- $sizesAttr := $srcsetData.sizesAttr -}}

                 {{- /* Build extra attributes dict with tooltip */ -}}
                 {{- $extraAttrs := dict -}}
                 {{- $tooltipClass := "tippy" -}}
                 {{- $tooltipText := index $tooltipSplits 1 | default ($basename | title) -}}
                 {{- $extraAttrs = merge $extraAttrs (dict "data-tippy-content" $tooltipText) -}}

                 {{- /* Render image with width/height */ -}}
                 {{- if and (ne $img.MediaType.SubType "svg") $img.Width -}}
                     {{- partial "image-render.html" (dict "img" $img "srcsetParts" $srcsetParts "sizesAttr" $sizesAttr "alt" (index $tooltipSplits 1 | default ($basename | title)) "class" $tooltipClass "width" $img.Width "height" $img.Height "extraAttrs" $extraAttrs) -}}
                 {{- else -}}
                     <img alt="{{ index $tooltipSplits 1 | default ($basename | title) }}" class="tippy" data-tippy-content="{{ $tooltipText }}" src="{{ $img.RelPermalink }}" />
                 {{- end -}}

                 {{- end -}}
            </div>
            {{ end -}}
            {{ end }}
        </div>
    </div>
    {{ if ne $caption "" }}
    <figcaption>{{ $caption }}</figcaption>
    {{ end }}
</figure>
